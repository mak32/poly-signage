<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MDA Space Digital Signage</title>

  <style>
    :root {
      --teal: #00A990;
      --bg: #071014;
      --text: #ffffff;
      --muted: #cfd8dc;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body { position: relative; }

    /* Normal MDA background */
    .background {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20% 30%, rgba(0,169,144,0.16), transparent 28%),
        radial-gradient(circle at 80% 70%, rgba(0,169,144,0.10), transparent 25%),
        linear-gradient(135deg, #071014 0%, #0c171c 55%, #071014 100%);
      z-index: 0;
    }

    .background::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle, rgba(255,255,255,0.3) 1px, transparent 1px);
      background-size: 90px 90px;
      opacity: 0.08;
    }

    /* Header - teal line intentionally removed */
    .header {
      position: absolute;
      top: 4vh;
      left: 4vw;
      z-index: 10;
      display: flex;
      align-items: center;
    }

    .logo {
      width: 16vw;
      max-width: 320px;
      min-width: 180px;
      height: auto;
    }

    /* Slides */
    .slides {
      position: absolute;
      inset: 0;
      z-index: 2;
    }

    .slide {
      position: absolute;
      inset: 0;
      padding: 18vh 7vw 8vh 7vw;
      opacity: 0;
      transform: scale(1.015);
      transition: opacity 1s ease, transform 1s ease;
      display: flex;
      align-items: center;
      pointer-events: none;
    }

    .slide.active {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    /* Normal content */
    .content { max-width: 80vw; }

    .eyebrow {
      color: var(--teal);
      text-transform: uppercase;
      letter-spacing: 0.22em;
      font-size: clamp(18px, 1.4vw, 30px);
      font-weight: 700;
      margin-bottom: 2vh;
    }

    h1 {
      font-size: clamp(54px, 5.3vw, 110px);
      line-height: 0.98;
      margin: 0 0 2.5vh 0;
      font-weight: 700;
      max-width: 1200px;
    }

    .subtitle {
      font-size: clamp(24px, 2vw, 42px);
      line-height: 1.4;
      color: var(--muted);
      max-width: 1100px;
    }

    /* Full-screen image slides */
    .image-slide {
      padding: 0;
      margin: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      z-index: 20;
      background: #000000;
    }

    .fullscreen-image {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      object-position: center center;
      display: block;
      margin: 0;
      padding: 0;
    }

    /* Global live clock - top right on every slide */
    .global-clock {
      position: absolute;
      top: 2.5vh;
      right: 2vw;
      z-index: 100;
      display: flex;
      align-items: center;
      min-width: 250px;
      padding: 10px 16px;
      background: rgba(0,0,0,0.72);
      border-radius: 8px;
      border: 1px solid rgba(0,169,144,0.35);
      box-shadow: 0 4px 18px rgba(0,0,0,0.30);
    }

    .clock-icon {
      width: 40px;
      height: 40px;
      border: 3px solid #ffffff;
      border-radius: 50%;
      margin-right: 13px;
      position: relative;
      flex-shrink: 0;
    }

    .clock-icon::before {
      content: "";
      position: absolute;
      width: 3px;
      height: 11px;
      background: white;
      left: 16px;
      top: 7px;
      transform-origin: bottom center;
    }

    .clock-icon::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 3px;
      background: white;
      left: 17px;
      top: 18px;
      transform-origin: left center;
      transform: rotate(35deg);
    }

    .clock-text {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .live-time {
      color: #ffffff;
      font-size: clamp(21px, 1.45vw, 31px);
      font-weight: 700;
      line-height: 1;
    }

    .live-date {
      color: #ffffff;
      font-size: clamp(13px, 0.85vw, 18px);
      margin-top: 5px;
      white-space: nowrap;
    }

    /* Footer */
    .footer {
      position: absolute;
      bottom: 3vh;
      left: 4vw;
      right: 4vw;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      color: #8fa1a8;
      font-size: clamp(14px, 0.9vw, 20px);
    }

    .dots {
      display: flex;
      gap: 9px;
      align-items: center;
    }

    .dot {
      width: 10px;
      height: 10px;
      background: rgba(255,255,255,0.25);
      border-radius: 50%;
    }

    .dot.active { background: var(--teal); }

    /* Hide normal frame on image slides; clock remains visible */
    body.image-active .header,
    body.image-active .footer,
    body.image-active .background {
      display: none;
    }
  </style>
</head>

<body>
  <div class="background"></div>

  <div class="header">
    <img src="mda-logo.png" alt="MDA Space" class="logo">
  </div>

  <div class="slides">

    <!-- Slide 1: Welcome - 15 sec -->
    <section class="slide active" data-duration="15000">
      <div class="content">
        <div class="eyebrow">Welcome</div>
        <h1>Welcome to MDA Space</h1>
        <div class="subtitle">Building the space between proven and possible.</div>
      </div>
    </section>

    <!-- Slide 2: Employee Wi-Fi - 30 sec -->
    <section class="slide image-slide" data-duration="30000">
      <img
        src="./employee-wifi.png?v=5"
        class="fullscreen-image"
        alt="MDA Employee Wi-Fi Guide"
      >
    </section>

    <!-- Slide 3: Teams Room Guide - 45 sec -->
    <section class="slide image-slide" data-duration="45000">
      <img
        src="./tap-meeting-guide.png?v=10"
        class="fullscreen-image"
        alt="Microsoft Teams Room Guide"
      >
    </section>

    <!-- Slide 4: IT Communications - 15 sec -->
    <section class="slide" data-duration="15000">
      <div class="content">
        <div class="eyebrow">IT &amp; Employee Communications</div>
        <h1>Stay Secure.<br>Stay Connected.</h1>
        <div class="subtitle">
          Keep your device updated, report suspicious emails,
          and contact the IT Help Desk for assistance.
        </div>
      </div>
    </section>

  </div>

  <!-- Global live clock -->
  <div class="global-clock">
    <div class="clock-icon"></div>
    <div class="clock-text">
      <div id="liveTime" class="live-time">--:-- --</div>
      <div id="liveDate" class="live-date">Loading...</div>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <div>MDA Space • Internal Communications</div>

    <div class="dots">
      <div class="dot active"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>

  <script>
    var slides = document.querySelectorAll('.slide');
    var dots = document.querySelectorAll('.dot');
    var currentSlide = 0;
    var slideTimer = null;

    function showSlide(index) {
      var i;

      for (i = 0; i < slides.length; i++) {
        slides[i].classList.remove('active');
      }

      for (i = 0; i < dots.length; i++) {
        dots[i].classList.remove('active');
      }

      slides[index].classList.add('active');

      if (dots[index]) {
        dots[index].classList.add('active');
      }

      if (slides[index].classList.contains('image-slide')) {
        document.body.classList.add('image-active');
      } else {
        document.body.classList.remove('image-active');
      }

      var duration = parseInt(
        slides[index].getAttribute('data-duration'),
        10
      );

      if (!duration) {
        duration = 15000;
      }

      if (slideTimer) {
        clearTimeout(slideTimer);
      }

      slideTimer = setTimeout(function () {
        currentSlide++;

        if (currentSlide >= slides.length) {
          currentSlide = 0;
        }

        showSlide(currentSlide);
      }, duration);
    }

    function updateClock() {
      var now = new Date();

      var hours = now.getHours();
      var minutes = now.getMinutes();
      var ampm = hours >= 12 ? "PM" : "AM";

      hours = hours % 12;

      if (hours === 0) {
        hours = 12;
      }

      if (minutes < 10) {
        minutes = "0" + minutes;
      }

      var timeText =
        hours + ":" + minutes + " " + ampm;

      var weekdays = [
        "Sunday",
        "Monday",
        "Tuesday",
        "Wednesday",
        "Thursday",
        "Friday",
        "Saturday"
      ];

      var months = [
        "January",
        "February",
        "March",
        "April",
        "May",
        "June",
        "July",
        "August",
        "September",
        "October",
        "November",
        "December"
      ];

      var dateText =
        weekdays[now.getDay()] +
        ", " +
        months[now.getMonth()] +
        " " +
        now.getDate() +
        ", " +
        now.getFullYear();

      var timeElement =
        document.getElementById("liveTime");

      var dateElement =
        document.getElementById("liveDate");

      if (timeElement) {
        timeElement.innerHTML = timeText;
      }

      if (dateElement) {
        dateElement.innerHTML = dateText;
      }
    }

    window.onload = function () {
      updateClock();
      setInterval(updateClock, 1000);
      showSlide(0);
    };
  </script>

</body>
</html>
